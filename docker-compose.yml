version: '3.8'

services:
  ats-scorer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ats-scorer
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - ATS_AI_ENABLED=${ATS_AI_ENABLED:-false}
      - ATS_AI_PROVIDER=${ATS_AI_PROVIDER:-groq}
      - ATS_AI_HTTP_CONNECT_TIMEOUT=${ATS_AI_HTTP_CONNECT_TIMEOUT:-5s}
      - ATS_AI_HTTP_READ_TIMEOUT=${ATS_AI_HTTP_READ_TIMEOUT:-60s}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spend-output=- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
