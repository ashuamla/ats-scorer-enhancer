server.port=8080

logging.level.root=INFO
logging.level.com.ats.scorer=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n%ex

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ATS Scorer configuration
ats.scoring.keyword-weight=0.4
ats.scoring.section-weight=0.2
ats.scoring.experience-weight=0.2
ats.scoring.format-weight=0.2
